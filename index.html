<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<meta name="referrer" content="no-referrer">
<title>Now Playing</title>
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Ambient background: two layers so album art can crossfade -->
<div id="bg" aria-hidden="true"><div class="layer"></div><div class="layer"></div><div class="veil"></div><div class="grain"></div></div>

<div id="chrome">
  <a href="#/" data-route="" class="pill">Now Playing</a>
  <a href="#/top" data-route="top" class="pill">Top</a>
  <span class="spacer"></span>
  <button id="btn-wake" class="icon" title="화면 켜두기" aria-label="화면 켜두기"></button>
  <button id="btn-fs" class="icon" title="전체 화면" aria-label="전체 화면"></button>
  <button id="btn-out" class="icon" title="로그아웃" aria-label="로그아웃"></button>
</div>

<main id="view"></main>
<script type="module" src="js/app.js"></script>
</body>
</html>
